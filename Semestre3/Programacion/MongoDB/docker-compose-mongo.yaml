services:
  # Servicio principal de MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    command: ["--auth"]
    restart: always
    ports:
      - "27017:27017" # Puerto estándar de MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: mi_base_datos
    volumes:
      - mongo_data:/data/db

  # Interfaz gráfica de administración (Opcional pero muy recomendada)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_container
    command: ["--auth"]
    restart: always
    ports:
      - "8082:8081" # Accedes en tu navegador vía http://localhost:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:secretpassword@mongodb:27017/
    depends_on:
      - mongodb

# Volumen persistente para que los datos no se borren al apagar el contenedor
volumes:
  mongo_data:
