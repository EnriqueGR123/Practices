<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Gestión de Estudiantes — FastAPI + MongoDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root{
      --bg:#0b1020; --card:#121a33; --muted:#9fb0ff; --txt:#eaf0ff; --accent:#6ea8fe; --danger:#ff6b6b;
      --border:#1f2a4d; --chip:#1a254a; --chip-b:#2e3c6f; --input:#0f1731
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
      background:linear-gradient(180deg,#0a0f24, #0e1633);color:var(--txt)}
    header{padding:24px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0b1020cc;backdrop-filter:blur(6px)}
    h1{margin:0;font-size:clamp(18px,3vw,24px)}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 20px #00000040;margin-bottom:16px}
    .content{padding:16px}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
    .muted{color:var(--muted);font-size:13px}
    .btn{border:none;border-radius:10px;padding:10px 14px;color:#0b1020;background:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn.outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    .btn.danger{background:var(--danger);color:#1c0b0b}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;background:var(--input);border:1px solid #27335c;color:var(--txt);
      border-radius:10px;padding:10px 12px;outline:none}
    input:focus{border-color:#4165d8;box-shadow:0 0 0 3px #4165d840}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:700px){.row{grid-template-columns:1fr}}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    th,td{padding:10px 12px;text-align:left;font-size:14px}
    th{color:#a9bbff;font-weight:700}
    tr{background:var(--input);border:1px solid #23305a}
    tr td:first-child, tr th:first-child{border-top-left-radius:12px;border-bottom-left-radius:12px}
    tr td:last-child, tr th:last-child{border-top-right-radius:12px;border-bottom-right-radius:12px}
    .pill{font-size:12px;color:#d8e1ff;background:var(--chip);border:1px solid var(--chip-b);border-radius:999px;padding:4px 10px}
    td button{padding:8px 10px;border-radius:10px}
    td.actions{display:flex;gap:8px;align-items:center}
    /* Panel colapsable */
    .collapsible{max-height:0;overflow:hidden;transition:max-height .35s ease, border-color .35s ease;border:1px solid transparent}
    .collapsible.open{max-height:560px;border-color:var(--border)}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>FastAPI + MongoDB</h1>
      <h1>Gestión de estudiantes</h1>
      <div class="muted">CRUD desde interfaz propia.</div>
      <div class="muted">Endpoints: <code>/estudiantes</code></div>
    </div>
  </header>

  <main class="container">
    <!-- Tabla -->
    <section class="card">
      <div class="content">
        <div class="toolbar">
          <h2 style="margin:0">Estudiantes</h2>
          <div style="display:flex;gap:8px">
            <button class="btn outline" onclick="loadStudents()">
              <i class="bi bi-arrow-clockwise"></i> 
            </button>
            <button class="btn" onclick="openPanel('create')">
              <i class="bi bi-plus-lg"></i> 
            </button>
          </div>
        </div>

        <div class="muted" id="list-msg" style="margin-bottom:8px">Lista inicial.</div>

        <div style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Carrera</th>
                <th>Semestre</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="students-body">
              <!-- filas -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Panel desplegable: Crear/Editar -->
    <section class="card collapsible" id="panel-form" aria-hidden="true">
      <div class="content">
        <div class="toolbar" style="margin-bottom:6px">
          <h2 id="panel-title" style="margin:0">Crear estudiante</h2>
          <button class="btn outline" onclick="closePanel()">
            <i class="bi bi-x-lg"></i> Cerrar
          </button>
        </div>
        <div class="muted" id="form-hint" style="margin:-6px 0 10px 0">Completa los campos y guarda.</div>

        <form id="student-form" onsubmit="return submitForm(event)">
          <input type="hidden" id="id" />
          <div class="row">
            <div>
              <label>Nombre</label>
              <input id="nombre" required placeholder="Ej. Ana Pérez" />
            </div>
            <div>
              <label>Email</label>
              <input id="email" type="email" required placeholder="ana.perez@udg.mx" />
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <div>
              <label>Carrera</label>
              <input id="carrera" required placeholder="Informática" />
            </div>
            <div>
              <label>Semestre</label>
              <input id="semestre" type="number" min="1" max="12" required placeholder="1" />
            </div>
          </div>

          <div style="display:flex; gap:8px; margin-top:14px">
            <button class="btn" id="btn-submit">
              <i class="bi bi-check2-circle"></i> Guardar
            </button>
            <button type="button" class="btn outline" onclick="resetFormUI()">
              <i class="bi bi-eraser-fill"></i> Limpiar
            </button>
          </div>

          <div class="muted" id="form-msg" style="margin-top:10px"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    // === Config ===
    const API = ""; // mismo origen (sirviendo /app desde FastAPI)

    // === Estado panel ===
    let PANEL_MODE = "create"; // "create" | "edit"

    // === Utilidades ===
    function setMsg(id, text){ document.getElementById(id).textContent = text; }
    function setDisabled(disabled){ document.getElementById("btn-submit").disabled = disabled; }
    async function safeJson(res){ try{ return await res.json(); }catch{ return null; } }
    function escapeHtml(s){ return String(s).replace(/[&<>"'`=\/]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[t])); }

    // === Cargar lista ===
    async function loadStudents(){
      setMsg("list-msg", "Cargando...");
      try{
        const res = await fetch(`${API}/estudiantes`);
        if(!res.ok) throw new Error("Error al listar");
        const data = await res.json();
        renderTable(data);
        setMsg("list-msg", `Mostrando ${data.length} registro(s).`);
      }catch(err){
        console.error(err);
        setMsg("list-msg", "No se pudo cargar la lista.");
      }
    }

    // === Render de tabla ===
    function renderTable(rows){
      const tbody = document.getElementById("students-body");
      tbody.innerHTML = "";
      if(!rows.length){
        tbody.innerHTML = `<tr><td colspan="5" class="muted">No hay estudiantes.</td></tr>`;
        return;
      }
      for(const r of rows){
        const tr = document.createElement("tr");
        const rid = r._id ?? r.id; // compatibilidad
        tr.innerHTML = `
          <td>${escapeHtml(r.nombre ?? "")}</td>
          <td><span class="pill">${escapeHtml(r.email ?? "")}</span></td>
          <td>${escapeHtml(r.carrera ?? "")}</td>
          <td>${r.semestre ?? ""}</td>
          <td class="actions">
            <button class="btn outline" title="Editar" onclick='openPanel("edit", ${JSON.stringify(r)})'>
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button class="btn danger" title="Eliminar" onclick='removeStudent("${rid}")'>
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    // === Panel (abrir/cerrar) ===
    function openPanel(mode="create", data=null){
      PANEL_MODE = mode;
      const panel = document.getElementById("panel-form");
      const title = document.getElementById("panel-title");
      const hint  = document.getElementById("form-hint");

      if(mode === "create"){
        title.textContent = "Crear estudiante";
        hint.textContent  = "Completa los campos y guarda.";
        resetFormCore();
      } else {
        title.textContent = "Editar estudiante";
        hint.textContent  = "Modifica los campos y guarda.";
        prefillCore(data);
      }

      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
      panel.scrollIntoView({behavior:"smooth", block:"start"});
      setTimeout(()=> document.getElementById("nombre").focus(), 200);
    }

    function closePanel(){
      const panel = document.getElementById("panel-form");
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
    }

    // === Form helpers ===
    function prefillCore(obj){
      document.getElementById("id").value = obj._id || obj.id || "";
      document.getElementById("nombre").value = obj.nombre || "";
      document.getElementById("email").value = obj.email || "";
      document.getElementById("carrera").value = obj.carrera || "";
      document.getElementById("semestre").value = obj.semestre ?? "";
      setMsg("form-msg", "Modo edición activo.");
    }

    function resetFormCore(){
      document.getElementById("student-form").reset();
      document.getElementById("id").value = "";
      setMsg("form-msg", "");
    }

    function resetFormUI(){
      resetFormCore();
      setMsg("form-msg", "Formulario limpio.");
    }

    // === Submit (create/edit) ===
    async function submitForm(e){
      e.preventDefault();
      const id = document.getElementById("id").value.trim();
      const payload = {
        nombre:  document.getElementById("nombre").value.trim(),
        email:   document.getElementById("email").value.trim(),
        carrera: document.getElementById("carrera").value.trim(),
        semestre: Number(document.getElementById("semestre").value)
      };
      const isEdit = (PANEL_MODE === "edit");
      const url = isEdit ? `${API}/estudiantes/${id}` : `${API}/estudiantes`;
      const method = isEdit ? "PUT" : "POST";

      setDisabled(true);
      setMsg("form-msg", isEdit ? "Actualizando..." : "Guardando...");
      try{
        const res = await fetch(url, {
          method,
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        if(!res.ok){
          const err = await safeJson(res);
          throw new Error(err?.detail || "Error en la operación");
        }
        await loadStudents();
        setMsg("form-msg", isEdit ? "Estudiante actualizado." : "Estudiante creado.");
        if(!isEdit) resetFormCore(); // en crear: limpia
        // Si quieres cerrar el panel tras guardar: descomenta
        // closePanel();
      }catch(err){
        console.error(err);
        setMsg("form-msg", err.message || "Falló la operación.");
      }finally{
        setDisabled(false);
      }
      return false;
    }

    // === Eliminar ===
    async function removeStudent(id){
      if(!confirm("¿Eliminar este estudiante?")) return;
      try{
        const res = await fetch(`${API}/estudiantes/${id}`, { method:"DELETE" });
        if(!res.ok){
          const err = await safeJson(res);
          throw new Error(err?.detail || "No se pudo eliminar");
        }
        await loadStudents();
        setMsg("list-msg", "Estudiante eliminado.");
      }catch(err){
        console.error(err);
        setMsg("list-msg", err.message || "Error al eliminar.");
      }
    }

    // Inicio
    loadStudents();
  </script>
</body>
</html>
